name: Develop required checks

on:
  push:
    branches:
      - develop
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: develop-required-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.21.x'
          cache: true

      - name: Install tools
        run: make tools

      - name: Install Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4

      - name: Run unit tests
        run: make test

      - name: Run linters
        run: make lint
