name: Generate CHANGELOG
on:
  push:
    branches:
      - develop
    paths:
      - '.changelog/**'
  workflow_dispatch:

concurrency:
  group: repository-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  GenerateChangelog:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .ci/tools/go.mod
      - run: cd .ci/tools && go install github.com/hashicorp/go-changelog/cmd/changelog-build
      - run: ./.ci/scripts/generate-changelog.sh
      - run: |
          if [[ `git status --porcelain` ]]; then
            if ${{ github.event_name == 'workflow_dispatch' }}; then
              MSG="Update CHANGELOG.md (Manual Trigger)"
            else
              MSG="Update CHANGELOG.md"
            fi
            git config --local user.email github-actions[bot]@users.noreply.github.com
            git config --local user.name github-actions[bot]
            git add CHANGELOG.md
            git commit -m "$MSG"
            git push origin HEAD:develop
          fi
