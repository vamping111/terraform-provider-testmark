name: Run linters for the code

on:
  pull_request:
    branches: 'develop'
    paths: 'internal/**'
    types: 
      - labeled
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  code-linter:
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: 1.21.x

    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    - name: Install tools
      run: make tools

    - name: Install Docker
      uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4

    - name: Define owner
      if: contains(github.event.pull_request.labels.*.name, 'NeedSDK')
      env:
        PR_FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
      run: |
        echo "FORK_OWNER=${PR_FORK_OWNER}" >> "$GITHUB_ENV"

    - name: Define aws-sdk-go's branch
      if: contains(github.event.pull_request.labels.*.name, 'NeedSDK')
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        SDK_BRANCH=$(echo "${PR_BODY}" | grep -oE 'aws-sdk-go=[^[:space:]]+' || true)
        if [[ -n "$SDK_BRANCH" ]]; then
          BRANCH=$(echo "$SDK_BRANCH" | cut -d '=' -f2 | tr -d '\r')
        else
          BRANCH="${PR_HEAD_REF}"
        fi
        if [[ ! "${BRANCH}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || ! git check-ref-format "refs/heads/${BRANCH}" >/dev/null; then
          echo "Invalid SDK branch name" >&2
          exit 1
        fi
        echo "AWS_SDK_GO_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

    - name: Define last commit of the fork
      if: contains(github.event.pull_request.labels.*.name, 'NeedSDK')
      env:
        FORK_OWNER: ${{ env.FORK_OWNER }}
        SDK_BRANCH: ${{ env.AWS_SDK_GO_BRANCH }}
      run: |
        FORK_COMMIT=$(git ls-remote "https://github.com/${FORK_OWNER}/testmark-sdk-go.git" "refs/heads/${SDK_BRANCH}" | awk 'NR == 1 { print $1 }')
        if [[ ! "${FORK_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Unable to resolve an immutable SDK commit" >&2
          exit 1
        fi
        echo "FORK_COMMIT=${FORK_COMMIT}" >> "$GITHUB_ENV"

    - name: Bump version in go.mod
      if: contains(github.event.pull_request.labels.*.name, 'NeedSDK')
      env:
        FORK_COMMIT: ${{ env.FORK_COMMIT }}
        FORK_OWNER: ${{ env.FORK_OWNER }}
      run: |
        go mod edit -replace "github.com/aws/aws-sdk-go=github.com/${FORK_OWNER}/testmark-sdk-go@${FORK_COMMIT}"

    - name: Apply dependencies
      run: go mod tidy

    - name: Run linters for the code
      run: make lint
