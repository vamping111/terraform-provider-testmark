name: Release of the provider to private registry

on:
  workflow_dispatch:
    
jobs:
  private-release:
    if: github.ref == 'refs/heads/develop'
    environment: provider-release
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: 'pypy3.10'

    - name: Install s3cmd
      run: sudo pip install s3cmd==2.4.0

    - name: Create S3 config
      run: |
        umask 077
        printf '%s' "${{ secrets.s3_config }}" > ./.s3cfg

    - name: Run script
      id: run-script
      env:
        S3_CMD_CFG_LOCATION: "./.s3cfg"
      run: ./scripts/update-s3-registry.sh

    - name: Upload S3 backup to artifacts
      if: ${{ failure() && steps.run-script.conclusion == 'failure' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: s3_backup
        path: ./s3_backup/

    - name: Remove S3 credentials
      if: always()
      run: rm -f ./.s3cfg
