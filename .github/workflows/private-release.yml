name: Release of the provider to private registry

on:
  workflow_dispatch:
    inputs:
      confirm_test_registry_write:
        description: 'Type ENABLE_TEST_REGISTRY_WRITE to allow an S3 update'
        required: true
        type: string

concurrency:
  group: repository-write
  cancel-in-progress: false

permissions:
  contents: read
    
jobs:
  private-release:
    if: github.repository == 'vamping111/terraform-provider-testmark' && github.ref == 'refs/heads/develop' && inputs.confirm_test_registry_write == 'ENABLE_TEST_REGISTRY_WRITE' && vars.ENABLE_TEST_REGISTRY_WRITE == 'true'
    environment: provider-release
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: 'pypy3.10'

    - name: Install s3cmd
      run: python -m pip install s3cmd==2.4.0

    - name: Create S3 config
      env:
        S3_CONFIG: ${{ secrets.s3_config }}
      run: |
        umask 077
        printf '%s' "${S3_CONFIG}" > ./.s3cfg

    - name: Run script
      id: run-script
      env:
        RELEASE_MIRROR_URL: ${{ vars.TEST_RELEASE_MIRROR_URL }}
        S3_BUCKET_NAME: ${{ vars.TEST_S3_BUCKET_NAME }}
        S3_CMD_CFG_LOCATION: "./.s3cfg"
        PROVIDER_NAME: "vamping111/testmark"
        S3_REGISTRY_URL: ${{ vars.TEST_S3_REGISTRY_URL }}
      run: ./scripts/update-s3-registry.sh

    - name: Upload S3 backup to artifacts
      if: ${{ failure() && steps.run-script.conclusion == 'failure' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: s3_backup
        path: ./s3_backup/
        retention-days: 1

    - name: Remove S3 credentials
      if: always()
      run: rm -f ./.s3cfg
