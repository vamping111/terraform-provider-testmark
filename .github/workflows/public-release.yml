name: Building the provider for the public registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing provider tag to republish (for recovery only)'
        required: true
        type: string

concurrency:
  group: repository-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-release:
    if: github.repository == 'vamping111/terraform-provider-testmark'
    environment: provider-release
    runs-on: ubuntu-22.04
    steps:
    - name: Validate provider tag
      id: release-tag
      env:
        TAG_INPUT: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if [[ ! "${TAG_INPUT}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "tag must look like v25.6.0" >&2
          exit 1
        fi
        echo "tag=${TAG_INPUT}" >> "${GITHUB_OUTPUT}"

    - name: Create read-only GitHub App token
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      id: read-token
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PEM }}
        owner: vamping111
        repositories: terraform-provider-testmark
        permission-contents: read

    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        ref: refs/tags/${{ steps.release-tag.outputs.tag }}
        token: ${{ steps.read-token.outputs.token }}
        persist-credentials: false
        clean: true
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: 1.21.x

    - name: Verify tag is on develop branch
      env:
        TAG: ${{ steps.release-tag.outputs.tag }}
      run: |
        set -euo pipefail
        tag_commit=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
        develop_commit=$(git rev-parse --verify origin/develop)
        head_commit=$(git rev-parse HEAD)
        echo "Tag commit: ${tag_commit}"
        echo "Develop commit: ${develop_commit}"
        [[ "${head_commit}" == "${tag_commit}" ]] || { echo "Checkout is not the requested tag" >&2; exit 1; }
        if git merge-base --is-ancestor "${tag_commit}" "${develop_commit}"; then
          echo "Tag is on develop branch"
        else
          echo "Tag commit is not on develop branch"
          exit 1
        fi

    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

    - name: Create fresh release token
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      id: release-token
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PEM }}
        owner: vamping111
        repositories: terraform-provider-testmark
        permission-contents: write

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
      with:
        version: '~> v1'
        args: release --clean --timeout 180m
      env:
        GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
        GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
