name: Publishing of the internal documentation

on:
  workflow_dispatch:

permissions:
  contents: read
    
jobs:
  publish-internal-doc:
    if: github.repository == 'vamping111/terraform-provider-testmark' && vars.ENABLE_TEST_DOCS_PUBLISH == 'true'
    environment: internal-docs
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: 'pypy3.10'

    - name: Install s3cmd
      run: python -m pip install s3cmd==2.4.0

    - name: Install documentation tools
      run: ./scripts/build-docs.sh --tools

    - name: Create S3 config
      env:
        S3_CONFIG: ${{ secrets.s3_config }}
      run: |
        umask 077
        printf '%s' "${S3_CONFIG}" > ./.s3cfg

    - name: Run script
      env:
        S3_CMD_CFG_LOCATION: "./.s3cfg"
        S3_DOCS_BUCKET_NAME: ${{ vars.TEST_S3_DOCS_BUCKET_NAME }}
      run: ./scripts/build-docs.sh --push

    - name: Remove S3 credentials
      if: always()
      run: rm -f ./.s3cfg
