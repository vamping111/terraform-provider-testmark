name: Publishing of the internal documentation

on:
  workflow_dispatch:
    
jobs:
  publish-internal-doc:
    environment: internal-docs
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: 'pypy3.10'

    - name: Install s3cmd
      run: sudo pip install s3cmd==2.4.0 mkdocs mkdocs-material mkdocs-awesome-pages-plugin

    - name: Create S3 config
      run: |
        umask 077
        printf '%s' "${{ secrets.s3_config }}" > ./.s3cfg

    - name: Run script
      env:
        S3_CMD_CFG_LOCATION: "./.s3cfg"
      run: ./scripts/build-docs.sh --push

    - name: Remove S3 credentials
      if: always()
      run: rm -f ./.s3cfg
